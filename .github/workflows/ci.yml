name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pas de package-lock.json dans ce dépôt : `npm ci` ne s'applique pas.
      - run: npm install

      - name: Tests
        run: npm test

      # Le build ne nécessite aucune variable d'environnement : le serveur
      # journalise l'absence de token au chargement mais ne l'exige qu'à
      # l'exécution.
      - name: Build
        run: npm run build
