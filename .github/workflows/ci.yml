name: CI

# Jamais `pull_request_target` : le secret PENNYLANE_API_TOKEN ne doit pas
# atteindre le code d'une PR externe.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pas de package-lock.json dans ce dépôt : `npm ci` ne s'applique pas.
      - run: npm install

      - name: Tests
        run: npm test

      # Le build ne nécessite aucune variable d'environnement : le serveur
      # journalise l'absence de token au chargement mais ne l'exige qu'à
      # l'exécution.
      - name: Build
        run: npm run build

      # Démarre le serveur de production et interroge le vrai Pennylane. Le
      # secret MCP est généré par le script ; seul le token Pennylane vient
      # des secrets du dépôt.
      - name: Smoke
        run: npm run smoke
        env:
          PENNYLANE_API_TOKEN: ${{ secrets.PENNYLANE_API_TOKEN }}
